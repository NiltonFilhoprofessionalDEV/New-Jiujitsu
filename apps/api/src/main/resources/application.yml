spring:
  application:
    name: api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/academia}
    username: ${DATABASE_USERNAME:academia}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always

server:
  # "framework" somente atrás de um proxy confiável (ex.: Railway), para o IP real chegar ao rate limit
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api/v2
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: academia-api
    access-ttl: 15m
    refresh-ttl: 30d
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  login:
    max-attempts: 10
    window: 15m
  # Folgado o bastante para o Wi-Fi da academia (vários alunos no mesmo IP) e curto para conter abuso
  signup:
    max-attempts: ${APP_SIGNUP_MAX_ATTEMPTS:30}
    window: 1h
  # Teto geral por IP. Alto o bastante para a academia inteira atrás de um mesmo Wi-Fi.
  rate-limit:
    requests-per-minute: ${APP_RATE_LIMIT_PER_MINUTE:600}
  # Fuso usado para "hoje" (idade, data de matrícula). A fase 1 atende academias no Brasil.
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  billing:
    # Emissão diária das mensalidades (no fuso acima)
    cron: ${APP_BILLING_CRON:0 0 6 * * *}
  # Assinatura das academias na plataforma: teste grátis, tolerância antes do bloqueio e mensalidade
  subscription:
    # Desligado: app livre, sem bloqueio nem cobrança da assinatura
    enforced: ${APP_SUBSCRIPTION_ENFORCED:false}
    trial-days: ${APP_SUBSCRIPTION_TRIAL_DAYS:14}
    grace-days: ${APP_SUBSCRIPTION_GRACE_DAYS:5}
    monthly-price: ${APP_SUBSCRIPTION_MONTHLY_PRICE:100.00}
  platform:
    # E-mails separados por vírgula com acesso ao painel /admin
    admin-emails: ${APP_PLATFORM_ADMIN_EMAILS:}
  asaas:
    # Sandbox por padrão; produção: https://api.asaas.com/v3 (a chave precisa ser do mesmo ambiente)
    base-url: ${APP_ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
    api-key: ${APP_ASAAS_API_KEY:}
    webhook-token: ${APP_ASAAS_WEBHOOK_TOKEN:}
