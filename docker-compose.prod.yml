# Produção num servidor único: Caddy (HTTPS + frontend) -> API -> Postgres, com backup diário.
#
#   cp .env.production.example .env.production   # preencha os valores
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Servidor com pouca memória (ex.: 1 GB): gere as imagens em outra máquina, transfira com
# `docker save`/`docker load` e suba sem `--build`; o compose reaproveita as imagens nomeadas.
#
# Só o Caddy publica portas (80/443). API e banco ficam na rede interna.
name: academia-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    image: academia-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/academia
      DATABASE_USERNAME: academia
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?defina APP_JWT_SECRET}
      APP_COOKIE_SECURE: "true"
      # Tomcat aceita X-Forwarded-For só de proxies da rede interna (o Caddy)
      SERVER_FORWARD_HEADERS_STRATEGY: native
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      APP_RATE_LIMIT_PER_MINUTE: ${APP_RATE_LIMIT_PER_MINUTE:-600}
      APP_SUBSCRIPTION_ENFORCED: ${APP_SUBSCRIPTION_ENFORCED:-false}
      APP_PLATFORM_ADMIN_EMAILS: ${APP_PLATFORM_ADMIN_EMAILS:-}
      APP_ASAAS_BASE_URL: ${APP_ASAAS_BASE_URL:-https://api.asaas.com/v3}
      APP_ASAAS_API_KEY: ${APP_ASAAS_API_KEY:-}
      APP_ASAAS_WEBHOOK_TOKEN: ${APP_ASAAS_WEBHOOK_TOKEN:-}
      APP_RESEND_API_KEY: ${APP_RESEND_API_KEY:-}
      APP_MAIL_FROM: "${APP_MAIL_FROM:-BJJ Pulse <nao-responda@bjjpulse.com.br>}"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://bjjpulse.com.br}
      JAVA_TOOL_OPTIONS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v2/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      # CPUs pequenas (ex.: Oracle E2.1.Micro) levam mais de 1 min para subir o Spring
      start_period: 180s
      retries: 5

  web:
    build: ./apps/web
    image: academia-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN}
      APP_EXTRA_DOMAINS: ${APP_EXTRA_DOMAINS:-}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: academia
      PGDATABASE: academia
      PGPASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${APP_TIME_ZONE:-America/Sao_Paulo}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  pgdata:
  caddy_data:
  caddy_config:
