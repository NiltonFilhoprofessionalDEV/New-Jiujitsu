# Produção num servidor único: Caddy (HTTPS + frontend) -> API -> Postgres, com backup diário.
#
#   cp .env.production.example .env.production   # preencha os valores
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Só o Caddy publica portas (80/443). API e banco ficam na rede interna.
name: academia-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/academia
      DATABASE_USERNAME: academia
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?defina APP_JWT_SECRET}
      APP_COOKIE_SECURE: "true"
      # Tomcat aceita X-Forwarded-For só de proxies da rede interna (o Caddy)
      SERVER_FORWARD_HEADERS_STRATEGY: native
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      APP_RATE_LIMIT_PER_MINUTE: ${APP_RATE_LIMIT_PER_MINUTE:-600}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v2/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: academia
      PGDATABASE: academia
      PGPASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${APP_TIME_ZONE:-America/Sao_Paulo}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  pgdata:
  caddy_data:
  caddy_config:
